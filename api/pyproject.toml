[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycoding-api"
version = "0.1.0"
description = "HTTP API: submit jobs, check status, enforce quota."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    # The job table and its access layer live with the worker; both sides
    # share one schema rather than keeping two copies of it in step.
    "pycoding-worker",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pycoding-api = "pycoding_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
