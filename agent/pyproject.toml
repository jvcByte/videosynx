[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videosynx-agent"
version = "0.1.0"
description = "The tool layer an agent drives: an MCP server over the HTTP API."
requires-python = ">=3.11"
dependencies = [
    # mcp 2 renamed FastMCP to MCPServer and moved it to
    # mcp.server.mcpserver. The import below is that name, so this floor is
    # the version, not a preference -- 1.x fails at import with a message
    # saying exactly this.
    "mcp>=2",
    "httpx>=0.27",
    # Transitive through mcp, but named because this module imports Field
    # directly and a parameter description is part of the tool contract, not
    # an implementation detail.
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
videosynx-mcp = "videosynx_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]
